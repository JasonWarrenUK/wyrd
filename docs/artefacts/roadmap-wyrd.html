<!DOCTYPE html>
<!--
	roadmap-artefact.html: template consumed by `roadmap.py render`.
	Two placeholders, each substituted exactly once below: the phase-name
	title (in the head; the h1 is overwritten by JS from project/phase, since
	the two placeholders cannot diverge) and the JSON data blob
	(project, phase, generated, stats, ready, mermaid, validation, devColours,
	depKinds), which lands in the roadmap-data script element near the foot of
	the document. Render does a global string replace, so the data-blob token
	must appear verbatim exactly once in this file (the render step asserts
	this); a second copy here would inject the blob into this comment and the
	mermaid edge arrows would close the comment early and spill the JSON onto
	the page. For the same reason this comment must not contain a raw
	comment-close sequence.
	Everything else is static so regenerated artefacts diff cleanly.
	Palette: the canonical status/milestone-state/dev-chip colour table from
	library/references/roadmap-conventions.md (STATUS_STYLE in roadmap.py).
-->

	--color-primary-bg:      var(--color-pink-1);
	--color-primary-text:    var(--color-pink-6);
	/* Status semantics: green finished, gray blank, red stop, purple parked,
	   cinnamon shelved, faded gray struck, yellow external */
	--color-done:            var(--color-green-4);
	--color-done-bg:         var(--color-green-1);
	--color-todo:            var(--color-gray-4);
	--color-todo-bg:         var(--color-gray-1);

	--color-out-of-scope-bg: var(--color-gray-1);
	--color-gate:            var(--color-yellow-4);
	--color-gate-bg:         var(--color-yellow-1);
	/* Milestone-level derived state (see roadmap-conventions.md): azure is
	   unclaimed by task status and distinct from sky (structural), so a
	   part-done milestone reads as "live" rather than the same gray as
	   untouched work. */
	--color-in-progress:     var(--color-azure-4);
	--color-in-progress-bg:  var(--color-azure-1);
	/* Dev-chip palette: assignee is free-text with no roster (never
	   inferred), so chips are coloured by a stable hash, never a hardcoded
	   name map. Disjoint from every status/milestone/gate hue above. */
	--color-dev-teal:        var(--color-teal-4);
	--color-dev-teal-bg:     var(--color-teal-1);
	--color-dev-lime:        var(--color-lime-4);
	--color-dev-lime-bg:     var(--color-lime-1);
	--color-dev-magenta:     var(--color-magenta-4);

	--color-dev-amber:       var(--color-amber-4);
	--color-dev-amber-bg:    var(--color-amber-1);
	--color-dev-rose:        var(--color-rose-4);
	--color-dev-rose-bg:     var(--color-rose-1);

	--bg: var(--color-gray-1);
	--surface: #ffffff;
	--text: var(--color-gray-6);
	--muted: var(--color-gray-4);
	--line: var(--color-gray-2);
	--grid-line: rgba(0, 117, 144, 0.06);
}
@media (prefers-color-scheme: dark) {

		--color-milestone:       var(--color-sky-2);

		--color-out-of-scope:    var(--color-gray-5);
		--color-out-of-scope-bg: var(--color-gray-6);
		--color-gate:            var(--color-yellow-2);
		--color-gate-bg:         var(--color-yellow-6);
		--color-in-progress:     var(--color-azure-2);
		--color-in-progress-bg:  var(--color-azure-6);
		--color-dev-teal:        var(--color-teal-2);
		--color-dev-teal-bg:     var(--color-teal-6);
		--color-dev-lime:        var(--color-lime-2);
		--color-dev-lime-bg:     var(--color-lime-6);
		--color-dev-magenta:     var(--color-magenta-2);
		--color-dev-magenta-bg:  var(--color-magenta-6);
		--color-dev-indigo:      var(--color-indigo-2);
		--color-dev-indigo-bg:   var(--color-indigo-6);
		--color-dev-amber:       var(--color-amber-2);
		--color-dev-amber-bg:    var(--color-amber-6);
		--color-dev-rose:        var(--color-rose-2);
		--color-dev-rose-bg:     var(--color-rose-6);

		--bg: #121216;

	}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
	font-family: "IBM Plex Sans", system-ui, sans-serif;
	background:
		linear-gradient(var(--grid-line) 1px, transparent 1px),
		linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
		var(--bg);
	background-size: 32px 32px, 32px 32px, auto;
	color: var(--text);
	line-height: 1.55;
}
.layout { display: flex; max-width: 1200px; margin: 0 auto; gap: 2rem; padding: 0 1.25rem; }
nav {
	position: sticky; top: 0; align-self: flex-start;
	width: 180px; flex-shrink: 0; padding: 2rem 0;
	font-family: "IBM Plex Mono", monospace; font-size: 0.8rem;
}
nav a { display: block; padding: 0.35rem 0.6rem; color: var(--muted); text-decoration: none; border-left: 2px solid var(--line); }
nav a:hover, nav a.active { color: var(--color-milestone); border-left-color: var(--color-milestone); }
main { flex: 1; min-width: 0; padding: 2rem 0 4rem; }

header.page h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 0.2rem; }
header.page .meta { font-family: "IBM Plex Mono", monospace; font-size: 0.75rem; color: var(--muted); }

section { margin-top: 2.5rem; }
h2 {
	font-family: "IBM Plex Mono", monospace; font-size: 0.85rem; font-weight: 500;
	text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
	display: flex; align-items: center; gap: 0.5rem; margin: 0 0 1rem;
}
h2 .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--color-milestone); flex-shrink: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 1.1rem 1.3rem; min-width: 0; }
.card--hero { background: var(--color-milestone-bg); border-color: var(--color-milestone); }
.card--hero .kpi { font-size: 2.1rem; font-weight: 600; color: var(--color-milestone-text); }
.card--hero .kpi small { font-size: 1rem; font-weight: 400; color: var(--color-milestone); margin-left: 0.5rem; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.9rem; margin-top: 0.9rem; }
.grid > * { min-width: 0; }
.mini { border-color: var(--m-colour, var(--line)); }
.mini h3 { margin: 0 0 0.3rem; font-size: 0.9rem; font-weight: 600; overflow-wrap: break-word; }
.mini .count { font-family: "IBM Plex Mono", monospace; font-size: 0.75rem; color: var(--muted); }
.progress-bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 0.55rem; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; }

details.milestone {
	background: var(--surface); border: 1px solid var(--m-colour, var(--line));
	border-radius: 8px; margin-bottom: 0.8rem;
}
details.milestone > summary {
	cursor: pointer; padding: 0.85rem 1.2rem; font-weight: 600;
	display: flex; align-items: center; gap: 0.7rem; list-style: none; min-width: 0;
}
details.milestone > summary::-webkit-details-marker { display: none; }
details.milestone > summary .mid {
	font-family: "IBM Plex Mono", monospace; font-size: 0.72rem;
	background: var(--color-milestone-bg); color: var(--color-milestone-text);
	border: 1px solid var(--color-milestone); border-radius: 4px; padding: 0.1rem 0.4rem;
}
details.milestone > summary .count { margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
details.milestone .body { padding: 0 1.2rem 1rem; }
.group h4 { font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; margin: 0.9rem 0 0.35rem; }
.group ul { list-style: none; margin: 0; padding: 0; }
.group li { padding: 0.28rem 0; overflow-wrap: break-word; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4rem; }
.tid {
	font-family: "IBM Plex Mono", monospace; font-size: 0.72rem;
	background: var(--color-primary-bg); color: var(--color-primary-text);
	border: 1px solid var(--color-primary); border-radius: 4px; padding: 0.05rem 0.35rem;
}
/* Generic coloured chip: dev-assignee and dependency chips share this shape,
   coloured per-instance via the --chip-fg/--chip-bg custom properties so one
   rule serves every status/milestone/gate/dev colour without a class per
   colour. */
.chip {
	font-family: "IBM Plex Mono", monospace; font-size: 0.7rem;
	background: var(--chip-bg, var(--line)); color: var(--chip-fg, var(--muted));
	border: 1px solid var(--chip-fg, var(--line)); border-radius: 4px; padding: 0.05rem 0.4rem;
	white-space: nowrap;
}
.deps { display: inline-flex; flex-wrap: wrap; gap: 0.3rem; margin-left: auto; }
.tasktext { flex: 1 1 auto; }
.depnote { color: var(--muted); font-size: 0.82rem; }
li.oos { text-decoration: line-through; color: var(--muted); }

.diagram-shell { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; position: relative; overflow: hidden; }
.diagram-toolbar { position: absolute; top: 0.5rem; right: 0.5rem; z-index: 2; display: flex; gap: 0.25rem; }
.diagram-toolbar button {
	font-family: "IBM Plex Mono", monospace; font-size: 0.8rem; line-height: 1;
	background: var(--bg); color: var(--text); border: 1px solid var(--line);
	border-radius: 4px; padding: 0.3rem 0.5rem; cursor: pointer;
}
.diagram-toolbar button:hover { border-color: var(--color-milestone); color: var(--color-milestone); }
.mermaid-wrap { overflow: hidden; cursor: grab; min-height: 320px; }
.mermaid-wrap:active { cursor: grabbing; }
.mermaid-wrap svg { display: block; transform-origin: 0 0; max-width: none !important; }
.diagram-shell.expanded { position: fixed; inset: 1.5rem; z-index: 10; box-shadow: 0 4px 40px rgba(0,0,0,0.35); }
.diagram-shell.expanded .mermaid-wrap { height: calc(100% - 0px); }

.legend {
	display: flex; flex-wrap: wrap; gap: 0.35rem 1.1rem; align-items: center;
	margin-top: 0.6rem; font-size: 0.78rem; color: var(--muted);
	font-family: "IBM Plex Mono", monospace;
}
.legend .key { display: inline-flex; align-items: center; gap: 0.4rem; }
.legend .sw { width: 0.9rem; height: 0.9rem; border-radius: 3px; border: 1.5px solid; box-sizing: border-box; }
.legend .key--mile { font-weight: 600; }
.legend .key--gate { font-style: italic; }
.legend .keynote { flex-basis: 100%; }

.nextup li:not(.nextup-devgroup) { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4rem; padding: 0.3rem 0; }
.nextup-devgroup { display: block; padding: 0; margin-top: 1rem; }
.nextup-devgroup:first-child { margin-top: 0; }
.nextup-devgroup h4 { margin: 0 0 0.4rem; font-size: 0.72rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.signal { color: var(--muted); font-size: 0.78rem; font-family: "IBM Plex Mono", monospace; margin-left: auto; }

.validation { border-left: 3px solid var(--color-blocked); background: var(--color-blocked-bg); color: var(--text); padding: 0.7rem 1rem; border-radius: 0 6px 6px 0; margin-top: 1rem; font-size: 0.85rem; }
.validation ul { margin: 0.3rem 0 0; padding-left: 1.1rem; }

@media (max-width: 760px) {
	.layout { flex-direction: column; gap: 0; }
	nav { position: sticky; top: 0; width: auto; display: flex; overflow-x: auto; gap: 0.25rem; padding: 0.6rem 0; background: var(--bg); z-index: 5; }
	nav a { border-left: none; border-bottom: 2px solid var(--line); white-space: nowrap; }
	nav a:hover, nav a.active { border-bottom-color: var(--color-milestone); }
}
</style>
</head>

				<span class="key key--gate"><i class="sw" style="background:var(--color-gate-bg);border-color:var(--color-gate);border-style:dashed"></i>external gate</span>

			</div>
		</section>

		<section id="nextup">
			<h2><span class="dot"></span>Next Up</h2>
			<div class="card"><ul class="nextup group" id="ready" style="list-style:none;margin:0;padding:0"></ul></div>
		</section>
	</main>

per orphan, defaulting to a case-insensitive name-match or else the group's first stage, plus a \"leave unchanged\" sentinel; `:kinds new`/`:stages new` submit handlers now append an advisory hint when their write orphans nodes. Superseded its original framing, which assumed SL.10/SL.11 already supported editing an existing kind's group or a group's stage list in place — neither does; both are create-only. Retitled and rescoped accordingly; the edit flows move to new tasks SL.16/SL.17, which depend on this engine rather than the reverse", "status": "done", "dependsOn": ["CP.16", "SL.13", "SL.6"], "milestone": "MA", "notes": "", "assignee": ""}, {"id": "SL.16", "description": "Edit kinds in TUI — `:kinds edit \u003cname\u003e` opens `kindFormPane` pre-populated from the existing entry (name, glyph, colour, stage group), replacing rather than appending on submit via a new `upsertKind` helper; the name-collision validator exempts the kind's own current name (`excludeName`, exact-match so a case-only rename still trips the check with a clearer message). Editing a baked-in default writes a full shadowing entry into the user's `kinds.jsonc` that permanently overrides the default; the form shows an explicit `huh.Note` warning when editing one. Renaming is supported (scope grew beyond the original framing, which left rename undecided) via a new `stage.RenameKind(store, index, oldName, newName)` cascade in `internal/stage/rename.go` — nodes store `Kind` as a plain string, so a registry-only rename would strand every node of that kind as `Unresolvable` (unrepairable by `ApplyRemap`, which only iterates `Orphans`); renaming a baked-in default additionally writes a tombstone shadow under the old name so the embedded default doesn't resurrect once the rename cascade has moved every node off it. Changing a kind's stage group (or renaming into a state that orphans nodes) calls `stage.DetectOrphans` after the registry rebuild and, when orphans are found within `maxRemapOrphans`, actively opens the `:stages remap` form (SL.14) rather than only appending a passive advisory hint — stronger than the originally-scoped \"route the user to\" language, and rather than silently resetting stages the way the single-node `applyKindStage` helper does today. Provenance: both `kindsOverlay` (previously no marker column at all) and `stagesOverlay` now distinguish `(custom)` (purely user-defined) from `(edited)` (a shadowed default) via a shared `provenanceMarker` helper — the old \"(custom)\" was a single marker keyed on name-absence-from-defaults, which stopped being sufficient once an edited default could keep its name", "status": "done", "dependsOn": ["SL.10", "SL.14"], "milestone": "MA", "notes": "", "assignee": ""}, {"id": "SL.17", "description": "Edit stage groups in TUI — `:stages edit \u003cname\u003e` opens `stageFormPane` pre-populated from the existing group (name, stages, cycle, loop target), replacing rather than appending on submit via a new `upsertStageGroup` helper; the name-collision validator exempts the group's own current name (same `excludeName`/case-only-rename handling as SL.16). Editing a baked-in default writes a full shadowing entry into `stages.jsonc`; the form shows the same `huh.Note` warning pattern as SL.16, extended to note that referencing kinds are shadowed too. Renaming is supported (scope grew beyond the original framing, matching SL.16's decision) via a new `stage.RenameStageGroup(store, oldName, newName)` cascade in `internal/stage/rename.go` — this is the harder fan-out case the original framing anticipated: groups are referenced by kinds, not nodes directly, so `task-flow` (shared by Task, Goblin, and Talk) requires repointing every referencing kind's `StageGroup` field, including writing fresh shadow copies for built-in kinds that reference the renamed group and aren't already shadowed; renaming a baked-in default group additionally writes its own tombstone shadow so the embedded group doesn't resurrect. `DetectOrphans`' `OrphanKey` being keyed by `(Kind, Stage)` means a shared-group edit surfaces as multiple distinct rows in the remap form, proven by a dedicated fan-out test asserting three rows for Task/Goblin/Talk. Same active `:stages remap` (SL.14) hand-off as SL.16 (opens the form directly rather than only a passive advisory hint), and the same two-marker `(custom)`/`(edited)` provenance distinction, both landing as shared infrastructure in SL.16 and reused here unchanged", "status": "done", "dependsOn": ["SL.11", "SL.14"], "milestone": "MA", "notes": "", "assignee": ""}, {"id": "SL.12", "description": "Stage group view in TUI — bare `:stages` palette command opens a read-only modal overlay listing every stage group (baked-in and user-defined); each row shows the group name, a `(custom)` provenance marker for user-defined groups, the cycle behaviour (`terminate` / `loop ↺` / `loop→\u003ctarget\u003e ↺`), and the full ordered stage progression (`A → B → C`); scrollable viewport, `esc`/`q` closes; `stagesOverlay` struct in `internal/tui/stages_overlay.go` mirroring `kindsOverlay`; composited via `compositeOverlay`; registry refreshed in-session after `:stages new` submits", "status": "done", "dependsOn": ["SL.3"], "milestone": "MA", "notes": "", "assignee": ""}, {"id": "SL.11", "description": "Create stage groups in TUI — `:stages new` palette command opens a two-group `huh` form: group 1 collects name (validated against the merged registry to prevent collision), ordered stages (one per line, `huh.NewText`), and cycle behaviour select; group 2 (hidden unless `loop-to-stage`) offers a loop-target select whose options are dynamically populated from the stages entered in group 1 via `huh.Select.OptionsFunc`; on submit, the form reads existing user groups via `store.ReadStages()`, appends the new `types.StageGroup`, and writes the full slice via a new `store.WriteStages([]types.StageGroup)` (mirrors `WriteConfig`); the in-memory registry is rebuilt in-session by re-merging via `stage.MergeStageGroups`, reassigning `m.stageGroups` and `m.kindsOverlay.stageGroups`; `StoreFS` interface extended with `WriteStages`; 6 test-mock stubs updated; `stage_form.go` is a new non-node form pane modelled on `spend_form.go`; status-bar confirmation with 2s auto-clear; `parseStages` helper; `NewStageFormPane` exported for tests", "status": "done", "dependsOn": ["SL.13"], "milestone": "MA", "notes": "", "assignee": ""}, {"id": "SL.13", "description": "User stage-group registry — `stages.jsonc` in the store's parent directory (sibling of `config.jsonc`) holds user-defined stage groups, loaded at startup and merged with the baked-in defaults (user groups shadow defaults of the same name via `MergeStageGroups`); `StageGroup.Validate` added to `internal/types/stage.go` (non-empty name, ≥1 stage, `loop-to-stage` requires a valid `loop_target`); `(*Store).ReadStages()` in `internal/store/store.go` mirrors `ReadKinds` (missing file → empty registry, lenient per-entry skip, whole-file failure → `ParseError`); `StoreFS` interface extended with `ReadStages`; 6 test-mock stubs updated; `main.go` now calls `s.ReadStages()` non-fatally and passes user groups to `MergeStageGroups`; `ResolveStageGroup` and all TUI consumers required no changes — the merged registry was already threaded through", "status": "done", "dependsOn": ["SL.3"], "milestone": "MA", "notes": "", "assignee": ""}, {"id": "SL.7c", "description": "TUI: kind selection in edit forms — all four `NewEdit*FormPane` constructors accept `kinds`/`stageGroups` registries and pre-populate `nodeKind` from `node.Kind`; a \"— none —\" sentinel option preserves the untriaged state; `applyKindStage` helper unifies create and edit stamping (replaces four copy-pasted inline blocks); CP.16 invariant: unchanged kind returns early leaving Kind/Stage untouched; changed kind re-stamps Kind and keeps Stage if the new group `Contains` it, else resets to the group's first stage; `StageGroup.Contains` exported (wraps `indexOf`); registries threaded through `handleEditNode` in `app.go`", "status": "done", "dependsOn": ["CP.16", "SL.7b"], "milestone": "MA", "notes": "", "assignee": ""}, {"id": "SL.7b", "description": "TUI: kind selection in remaining create forms — `newJournalFormPane`, `newNoteFormPane`, and `newBudgetFormPane` now accept the kind/stage registries, render a `huh.NewSelect` kind field (defaults Journal/Note/Budget respectively), and stamp `node.Kind`/`node.Stage` on create (nil-safe, CP.16 clone invariant preserved); three new baked-in kinds added (Journal→content-flow, Note→content-flow, Budget→budget-flow) plus a new `budget-flow` stage group `[Active, Closed]` (terminate); kind/group counts now 10/6; registries threaded through the three capture-bar dispatch sites in `app.go`", "status": "done", "dependsOn": ["SL.7a"], "milestone": "MA", "notes": "", "assignee": ""}, {"id": "SL.7a", "description": "TUI: kind selection in task create form — `newTaskFormPane` accepts `*types.KindRegistry` and `*types.StageGroupRegistry`; a `huh.NewSelect` kind field (options from `kinds.Names()`, default Task) is inserted after Body and before Status; `buildNode` stamps `node.Kind` and initialises `node.Stage` to `group.Stages[0]` on create only (nil-safe; edit mode preserves the clone's existing Kind/Stage via the `f.originalNode == nil` guard, keeping the CP.16 invariant); both registries threaded through the capture-bar dispatch in `app.go`", "status": "done", "dependsOn": ["CP.16", "SL.6"], "milestone": "MA", "notes": "", "assignee": ""}, {"id": "SL.9", "description": "Kind registry view in TUI — `:kinds` palette command lists registered kinds with glyph, colour, and stage group; `kindsOverlay` struct in `internal/tui/kinds_overlay.go`; inline row format (coloured glyph + kind name + stage-group name + ordered stages, loop groups marked `↺`); composited as a centred Lipgloss layer; nil-registry safe", "status": "done", "dependsOn": ["SL.15"], "milestone": "MA", "notes": "", "assignee": ""}, {"id": "SL.6", "description": "TUI: advance stage (`]`) and retreat stage (`[`) keypresses on selected node; wraps per kind's cycle behaviour; refreshes dashboard and detail pane inline (mirrors `handleEditSubmit`; the codebase uses inline refresh rather than a `nodeUpdatedMsg` message type); `handleStageShift` in `internal/tui/app.go`; routes writes through `StoreFS.UpdateNode` (new interface method) to keep the in-memory index live; `types.StageGroupRegistry`, `types.ResolveStageGroup`, `stage.MergeStageGroups` added; registry threaded through `tui.Config.StageGroups`", "status": "done", "dependsOn": ["SL.15"], "milestone": "MA", "notes": "", "assignee": ""}, {"id": "SL.15", "description": "TUI: show `Kind` and `Stage` in the detail pane — a kind/stage line renders immediately after the type badges, resolving the node's kind against the merged registry (`DetailRenderer.Kinds`, threaded from `m.kinds`) for glyph and colour; falls back to a plain muted stage string when the kind is empty or unresolved, and omits the line entirely when both fields are empty. `renderKindStageLine` in `internal/tui/detail.go`; nil-registry safe", "status": "done", "dependsOn": ["SL.5"], "milestone": "MA", "notes": "", "assignee": ""}, {"id": "SL.5", "description": "Ship default kinds: Task, Goblin, Habit, Event, Travel, Talk, Project — each referencing appropriate stage group (Task/Goblin/Talk → task-flow; Event/Travel → event-flow; Habit → habit-flow; Project → project-flow); two new baked-in stage groups added (habit-flow: loop, project-flow: terminate); `stage.DefaultKinds()` and `stage.MergeKinds()` in `internal/stage/kinds.go`; starter template kind implications recorded as JSONC comments; merged registry threaded through `tui.Config.Kinds` at startup; Bookmark kind deferred to NW.1", "status": "done", "dependsOn": ["SL.4"], "milestone": "MA", "notes": "", "assignee": ""}, {"id": "SL.4", "description": "Add `kinds.jsonc` config file — `types.Kind` struct (name, stage-group ref, glyph, colour) in `internal/types/kind.go`; `KindRegistry` with `Lookup`/`All`/`Names` and last-wins-by-name merge seam for SL.5; `(*Store).ReadKinds()` in `internal/store/` reads `~/wyrd/kinds.jsonc` (store parent, sibling of `config.jsonc`); missing file yields empty registry; individual invalid entries skipped (lenient); `StoreFS` interface extended; 6 test-mock stubs updated", "status": "done", "dependsOn": ["SL.3"], "milestone": "MA", "notes": "", "assignee": ""}, {"id": "SL.3", "description": "Ship three baked-in default stage groups as embedded JSONC: `task-flow` (Open→Maybe→Later→Soon→Now→Done), `event-flow` (Scheduled→Now→Finished), `content-flow` (Active→Reference)", "status": "done", "dependsOn": ["SL.2"], "milestone": "MA", "notes": "", "assignee": ""}, {"id": "SL.2", "description": "Define stage group data model — `StageGroup` struct (`Name`, ordered `Stages`, `Cycle`, `LoopTarget`) and `CycleBehaviour` type with three constants: `loop` (wrap to first), `terminate` (stay at end, idempotent), `loop-to-stage` (wrap to a named stage, falling back to first if the target is missing). `Next`/`Prev` advance and retreat honouring cycle behaviour at both boundaries — `Prev` wraps to the last stage for both looping modes (the symmetric inverse of advancing off the end). `(stage, ok)` return: `ok == false` means an unknown stage so callers leave the node untouched. `IsTerminal` reports the no-advance-possible stage for DL.1's blocking check. Pure data model in `internal/types/stage.go`; no I/O", "status": "done", "dependsOn": ["SL.1"], "milestone": "MA", "notes": "", "assignee": ""}, {"id": "SL.8b", "description": "TUI grouping for kind/stage — `detectGroupCol` recognises `kind` and `stage` columns alongside `category` (alias-triggered, e.g. `RETURN n.kind AS kind`); `toGroupLabel` is column-aware, pluralising kind values like categories and title-casing stage values without a plural (`now` → `Now`). The grouping/render machinery was already generic. No live view drives kind/stage grouping yet — that lands with SL.6/SL.7", "status": "done", "dependsOn": ["SL.8"], "milestone": "MA", "notes": "", "assignee": ""}, {"id": "SL.8", "description": "Query engine: `n.kind` and `n.stage` as first-class queryable properties in WHERE, RETURN, and ORDER BY; the index needed no changes (it stores whole nodes). Pre-lattice nodes return `\"\"` for both, so `WHERE n.kind = \"\"` finds untriaged nodes. NV.12 grouping split out as SL.8b", "status": "done", "dependsOn": ["SL.1"], "milestone": "MA", "notes": "", "assignee": ""}, {"id": "SL.1", "description": "Add `kind` and `stage` fields to Node struct and store serialisation; existing nodes lack both fields, so loading defaults them to empty (back-compat, no migration step); empty fields are omitted on write so legacy files are unchanged on rewrite", "status": "done", "dependsOn": [], "milestone": "MA", "notes": "", "assignee": ""}, {"id": "NW.1", "description": "Add `bookmark` node type with `url` property; `bm:` capture prefix triggers a form (url required, title optional; the form carries the SL.7 kind select from birth). `bm:` does not collide with `bc:`/`bs:` (prefix matching is exact); registering bookmark as a default kind folds into SL.5", "status": "todo", "dependsOn": ["SL.7b"], "milestone": "MB", "notes": "", "assignee": ""}, {"id": "NW.2", "description": "Add `answers` edge type; wire into edge management form (CP.11 done); detail pane renders linked answers under an ANSWERS section", "status": "blocked", "dependsOn": ["NW.1", "SL.8"], "milestone": "MB", "notes": "", "assignee": ""}, {"id": "DL.1", "description": "Derive `isBlocked` at query time from `blocks` edges — a node is blocked if any node pointing to it via a `blocks` edge has stage != terminal; expose as `n.isBlocked` computed property in the query engine. Terminality comes from the stage group model (`StageGroup.IsTerminal`, SL.2)", "status": "done", "dependsOn": ["DL.6", "SL.2", "SL.8"], "milestone": "MC", "notes": "", "assignee": ""}, {"id": "DL.3", "description": "Staleness indicator — compute days since `date.modified`; left pane shows a muted badge on nodes idle \u003e configurable threshold (default 14d); staleness needs nothing from the status lattice", "status": "done", "dependsOn": [], "milestone": "MC", "notes": "", "assignee": ""}, {"id": "DL.2", "description": "TUI: blocked badge on list items where `n.isBlocked` is true; detail pane shows BLOCKED BY section listing blocking nodes", "status": "done", "dependsOn": ["DL.1"], "milestone": "MC", "notes": "", "assignee": ""}, {"id": "DL.4", "description": "Backlog triage query — surfaces M highest-priority backlog items (low stages, highest staleness) plus one serendipitous pick; implemented as a saved view. Stage-based ranking needs queryable stages", "status": "todo", "dependsOn": ["DL.3", "SL.8"], "milestone": "MC", "notes": "", "assignee": ""}, {"id": "DL.5", "description": "Dashboard calmness threshold — when active-stage node count drops below configurable N, dashboard automatically appends backlog triage results as a separate section; N and M configurable in `config.jsonc`", "status": "blocked", "dependsOn": ["DL.4"], "milestone": "MC", "notes": "", "assignee": ""}, {"id": "DL.6", "description": "Thread Kind + StageGroup registries into the query engine so it can resolve stage terminality — add a `WithStageResolver(kinds, groups)` EngineOption (nil-safe, matching the existing `WithLogger` pattern in `internal/query/engine.go`); update the two CLI query paths (`queryCmd`, `viewCmd` in `cmd/wyrd/main.go`) to build and pass the registries, matching the TUI path, which already builds them. Enables stage-terminality resolution for computed properties like `isBlocked` (DL.1). An unresolvable blocker (empty stage, unknown kind, or no registries wired) is treated as still blocking (presence blocks), surfaced distinctly from a confirmed non-terminal block rather than silently.", "status": "done", "dependsOn": [], "milestone": "MC", "notes": "", "assignee": ""}, {"id": "SK.1", "description": "Define skein data model — a named partial Cypher fragment (WHERE clause, ORDER BY, or RETURN projection); stored as JSONC in `store/skeins/`", "status": "todo", "dependsOn": [], "milestone": "MD", "notes": "", "assignee": ""}, {"id": "SK.2", "description": "Store: read/write skeins via StoreFS; expose via GraphIndex as `GetSkein(name)` and `ListSkeins()`; extend the fsnotify watcher (currently `nodes/` and `edges/` only) to cover `skeins/`; sync commit messages should describe skein changes", "status": "blocked", "dependsOn": ["SK.1"], "milestone": "MD", "notes": "", "assignee": ""}, {"id": "SK.3", "description": "Query engine: resolve skein references at parse time — interpolated into the containing query before evaluation; circular references are a parse error", "status": "blocked", "dependsOn": ["SK.2"], "milestone": "MD", "notes": "", "assignee": ""}, {"id": "SK.4", "description": "TUI: skein management via palette — `:skein list`, `:skein new`, `:skein edit \u003cname\u003e`; edit opens a huh text form", "status": "blocked", "dependsOn": ["SK.3"], "milestone": "MD", "notes": "", "assignee": ""}, {"id": "TD.1", "description": "Consolidate JSONC parsing — six duplicated comment-stripping scanners exist: `internal/store/jsonc.go` (the reference implementation, string-aware, strips trailing commas), `internal/tui/theme.go`, `internal/tui/views/loader.go`, `internal/tui/ritual/loader.go`, `internal/stage/defaults.go`, and a regex variant in `internal/sync/merge.go` that is string-blind (a `//` inside a string value corrupts the file — the SY.2 data-loss bug lives here). Extract into a shared `internal/jsonc` package, repoint all six consumers, add trailing-comma and comment-inside-string tests. Priority raised by the 2026-08-04 audit: this is bug prevention, not tidiness — SY.2 depends on it", "status": "done", "dependsOn": [], "milestone": "ME", "notes": "", "assignee": ""}, {"id": "TD.2", "description": "ADR: unify default-asset lifecycle — themes ship as embedded starter-copy plus an in-Go fallback; templates/views/config are starter-copy only; stage groups (SL.3) are in-binary only; document which assets should be user-editable-on-disk vs code-owned-in-binary, decide whether any lifecycle should change, record the decision as an ADR in `docs/`. SL.16/SL.17 give this a concrete case to reason about: editing a baked-in kind or stage group now writes a permanent shadow copy (with a tombstone on rename so the embedded default doesn't resurrect), and TD.5 proposes stamping a provenance/version field at write time so a future reconciliation flow can detect when a shadowed entry has drifted from an updated upstream default — this ADR should weigh in on whether that stamping approach is the right shape for the shadow lifecycle generally, or whether asset shadowing deserves a different mechanism than the current \"write a full copy\" one", "status": "done", "dependsOn": [], "milestone": "ME", "notes": "", "assignee": ""}, {"id": "TD.3", "description": "Edge `Modified` timestamp — restructure `types.Edge` date properties into an embedded `DateFields`-style block holding the existing `Created` plus a new `Modified`; store write paths stamp `Modified` on every edge update; serialisation changes freely (pre-production, no back-compat constraint). Implementation question to settle: whether `Node`'s top-level `Created`/`Modified` should move into its date block for symmetry", "status": "done", "dependsOn": [], "milestone": "ME", "notes": "", "assignee": ""}, {"id": "TD.4", "description": "`gofmt` cleanup — originally scoped to `cmd/wyrd/main.go` (import-ordering drift plus a trailing-space alignment nit on the `query` command's `Args:` field), but `gofmt -l .` surfaced the same class of drift (struct-field/map-key/const-block alignment, import ordering) across 30 files repo-wide; ran `gofmt -w .` for the full sweep instead of the single-file fix. Whitespace/import-ordering only, no behavioural change", "status": "done", "dependsOn": [], "milestone": "ME", "notes": "", "assignee": ""}, {"id": "TD.5", "description": "Upstream default reconciliation (detection + markers) — shadowing a built-in kind or stage group (SL.16/SL.17) permanently overrides it, so improvements shipped to internal/stage/kinds/ or internal/stage/defaults/ in later releases never reach users who edited that entry, with no signal that they are diverged. internal/stage/reconcile.go adds DetectDiverged(kinds, groups), comparing every shadowed entry's stored ShadowOf against the current embedded default's hash under the same name. Three cases are deliberately excluded from being reported: tombstones (verbatim shadows written under an old name on rename — content-identical to their default by construction), RenameStageGroup's transitive fan-out shadows (permanently divergent by construction since their StageGroup was deliberately changed — a side effect of a rename, not drift to review), and a registry-wide 100% mismatch (treated as schema drift — a types.Kind/StageGroup field changed, invalidating every stored hash at once — rather than reported as universal divergence). Distinguishing the first two from an ordinary hand-edited shadow required a new types.ShadowReason field (ShadowEdited/ShadowTombstone/ShadowRenameFanOut), deliberately excluded from the ShadowOf content hash so introducing it doesn't itself invalidate every previously-stamped hash; stamped at all five sites that write a shadow. buildRegistries (cmd/wyrd/main.go) now also returns a stage.DivergenceReport, threaded through tui.Config.Divergence — the two CLI query paths discard it. Surfaced as a sticky startup status-bar advisory and a (diverged) marker in the :kinds/:stages overlays (recomputed fresh on every Open, provenanceColWidth widened 10→12 cells to fit). ⚠️ Scope note: this ships detection + markers only — the three-way combine UI (user value vs old default vs new default) is deferred to TD.18", "status": "done", "dependsOn": [], "milestone": "ME", "notes": "", "assignee": ""}, {"id": "TD.12", "description": "Overlay message-routing fix — the palette guard at `app.go:931-941` returns unconditionally on both branches (open or closed), so `ritualCheckTickMsg`, `WindowSizeMsg` and `spinner.TickMsg` are swallowed while the palette is open: the ritual scheduler stalls, resizes are lost, the sync spinner freezes. The five overlays (ritual/log/help/kinds/stages) already correctly decline non-key messages — this is not a six-guard problem, it is one guard. Fix the palette branch to fall through on non-key messages. Separately, dedupe the 5x copy-pasted form-mount tail (`app.go:746,762,797,813,845`) and 4x unmount block (`1007,1025,1031,1043`) into `mountFormPane`/`unmountForm` helpers while in the area.", "status": "done", "dependsOn": [], "milestone": "ME", "notes": "", "assignee": ""}, {"id": "TD.6", "description": "Restyle internal/tui/views/ for theme compliance, absorbed into TD.13's mounting work per this task's own instruction to fix while wiring each view onto ActiveTheme/PadLines/Spacer rather than as a standalone retrofit. list.go and timeline.go's Render path (timeline.go's RenderBlocks sibling was already compliant and served as the template) violated all four TUI styling rules: foreground-only styles, strings.Repeat(\" \", n) column/element gaps, and no PadLines wrap. Both renderers gained a Background field on their palette structs; viewPane (TD.13) builds the palette from ActiveTheme instead of calling Default*Palette(), and wraps the dispatched output in PadLines itself so internal/tui/views stays free of the internal/tui import that would create a circular dependency", "status": "done", "dependsOn": [], "milestone": "ME", "notes": "", "assignee": ""}, {"id": "TD.7", "description": "`detailReadyMsg` staleness guard — the handler mounts `msg.pane` without comparing `msg.nodeID` to the currently selected node, so two rapid selections can leave the slower render displayed for the wrong node. Compare and drop stale results; TD.12 fixes the related swallowed-while-overlay-open case", "status": "done", "dependsOn": [], "milestone": "ME", "notes": "", "assignee": ""}, {"id": "TD.8", "description": "Index-aware node removal — the fsnotify watcher deliberately ignores node Remove/Rename events, so a compaction synced in from another machine leaves ghost nodes in a running TUI until restart; meanwhile `cli.Compact` duplicates the index-maintaining `store.Compact` (dead code) with raw `os.Rename`. Give `GraphIndex` removal support, route compaction through the store, handle watcher removals, and add a watcher-driven index test (none exists today)", "status": "done", "dependsOn": [], "milestone": "ME", "notes": "", "assignee": ""}, {"id": "TD.9", "description": "Palette search performance — fuzzy search iterates `AllNodes()` plus `AllEdges()` on every keystroke, and `scoreEdge` does two `GetNode` title lookups per edge before knowing whether the edge matches; the first place typing will visibly lag on a large store. Defer the lookups until an edge matches and consider caching between keystrokes", "status": "done", "dependsOn": [], "milestone": "ME", "notes": "", "assignee": ""}, {"id": "TD.10", "description": "TUI small-fix batch — `buildNode` unconditionally overwrites `Date.Created` on edit (CP.16 breach); `shortNodeLabel`'s nil-index branch does `nodeID[:8]` unguarded (panics on malformed sub-8-char IDs); the status-bar clock calls `time.Now()` instead of the injected `Clock`; the unused background-less helpers `StyleAccent`/`StyleSectionHeader`/`SectionHeader` invite rule violations — fix or delete", "status": "done", "dependsOn": [], "milestone": "ME", "notes": "", "assignee": ""}, {"id": "TD.11", "description": "Store/CLI small-fix batch — `ReadNode` conflates every read failure with `NotFoundError` (contrast `ReadEdge`, which checks `isNotExist`); `buildIndex` silently skips corrupt files with bare `continue` , "status": "done", "dependsOn": [], "milestone": "MF", "notes": "", "assignee": ""}, {"id": "VP.6", "description": "Spring-eased pane focus transition — animate the focus-border colour fade (and optional 1-col width nudge) over ~150ms via harmonica `Spring.Update` driven by `tea.Tick`, instead of a hard snap; gate all motion behind a `reduce_motion` config toggle for accessibility. Sequenced after VP.4 because both touch the focused-border render path in `layout.go`", "status": "done", "dependsOn": ["VP.4"], "milestone": "MF", "notes": "", "assignee": ""}, {"id": "VP.7", "description": "Auto-generated key-hint footer — replace the hand-rolled `keyHints` in `statusbar.go` with the bubbles `help` component generating short/full help from the `key.Binding` set, with a `?`-toggle full view. Sequenced after CP.17 because both rework the statusbar surface and the footer must restore hints after a message dismissal", "status": "todo", "dependsOn": ["CP.17"], "milestone": "MF", "notes": "", "assignee": ""}, {"id": "VP.8", "description": "Stepped sync progress bar — `wyrd sync` shows an indeterminate MiniDot today; the git phases (stage → commit → pull → push) are discrete, so drive a determinate bubbles `progress` bar with phase labels from phased messages emitted by `internal/sync`; the bar's terminal failure state is displayed through the CP.17 dismissable-message mechanism", "status": "todo", "dependsOn": ["CP.17"], "milestone": "MF", "notes": "", "assignee": ""}, {"id": "VP.5", "description": "Floating modal overlays via compositor — overlays are composited via `lipgloss.Place` + `Layer`/`Compositor`, floating over the main frame and centred horizontally and vertically, with content-driven height rather than a fixed clamp; the log, help, and kinds overlays inherit correct sizing from the VP.9 height work", "status": "done", "dependsOn": ["VP.9"], "milestone": "MF", "notes": "", "assignee": ""}, {"id": "VP.9", "description": "Fix overlay panel overflow — resolved as par tone": "MF", "notes": "", "assignee": ""}, {"id": "SY.1", "description": "Register the merge driver — `cli.Init` (the path `openStore` actually uses) writes the `[merge \"wyrd-merge\"]` stanza to `.git/config` invoking the real `wyrd-merge-driver` binary (`%O %A %B`), pairing the `.gitattributes` entry it already writes; delete or repoint the dead `sync.Init` and its test (`TestInit_ConfiguresMergeDriver` currently tests the dead function, masking the gap)", "status": "blocked", "dependsOn": ["SY.2", "SY.3"], "milestone": "MH", "notes": "", "assignee": ""}, {"id": "SY.2", "description": "String-aware JSONC parsing in the merge driver — replace the regex comment/trailing-comma strippers in `internal/sync/merge.go` with the shared scanner from TD.1's consolidated package; add a merge test whose bodies contain `//` and URLs", "status": "done", "dependsOn": [], "milestone": "MH", "notes": "", "assignee": ""}, {"id": "SY.3", "description": "`MergeFiles` distinguishes missing from unparseable — check `os.IsNotExist` explicitly; a parse failure aborts the merge with an error instead of being read as \"that side deleted the file\" (the silent-archival data-loss path)", "status": "todo", "dependsOn": [], "milestone": "MH", "notes": "", "assignee": ""}, {"id": "SY.4", "description": "Fix `mergeObjectArray` last-write-wins — the swapped-order merge for theirs-newer entries is computed then discarded (`_ = merged`), so ours always wins regardless of timestamps; make theirs-newer entries actually win as ADR-005 rule 6 specifies", "status": "todo", "dependsOn": [], "milestone": "MH", "notes": "", "assignee": ""}, {"id": "SY.5", "description": "End-to-end git-driven merge test — real git repository, two clones, conflicting node edits (including URL-bearing bodies and same-entry spend-log conflicts), assert the driver is invoked and property-level merge results match ADR-005's rules", "status": "blocked", "dependsOn": ["SY.1", "SY.2", "SY.3", "SY.4"], "milestone": "MH", "notes": "", "assignee": ""}, {"id": "QC.1", "description": "Three-valued null logic — `null = null` currently evaluates `true` and `null \u003c\u003e x` evaluates `true` (Cypher: both `null`, row excluded), and `NOT null` evaluates `true` via truthiness; `WHERE` filters over absent properties are inverted as a result. Implement Cypher null propagation in `compareValues` and `NOT`", "status": "todo", "dependsOn": [], "milestone": "MI", "notes": "", "assignee": ""}, {"id": "QC.2", "description": "UNION column-name validation — only column count is checked; rows from later branches keep their own map keys while `Columns` comes from the first branch, so mismatched aliases silently project `nil` and plain `UNION` collapses those rows to one. Error on differing column names, as Cypher does", "status": "todo", "dependsOn": [], "milestone": "MI", "notes": "", "assignee": ""}, {"id": "QC.3", "description": "ORDER BY over expressions — sorting looks the recomputed column name up in the projected row, so `RETURN n.priority AS p ORDER BY n.priority` and ORDER BY on any unprojected expression silently no-op. Either evaluate ORDER BY expressions against the underlying match or reject unprojected expressions with a loud error", "status": "todo", "dependsOn": [], "milestone": "MI", "notes": "", "assignee": ""}, {"id": "QC.4", "description": "Type-aware comparison — cross-type equality and ordering fall back to `fmt.Sprintf(\"%v\")`, so `n.priority = \"1\"` matches the integer 1 and `10 \u003e \"5\"` compares lexicographically; JSONC properties arrive as mixed float64/string/bool so spurious matches are routine. Remove the string-format fallback; unlike-type comparisons follow Cypher (false/null)", "status": "todo", "dependsOn": [], "milestone": "MI", "notes": "", "assignee": ""}, {"id": "QC.5", "description": "Post-lex keyword rejection — the mutation/unsupported-keyword scan runs on raw query text, so keywords inside string literals or property names false-positive: `WHERE n.body = \"set the table\"` is rejected as a mutation and properties named `set`, `case`, `with`, `create`, `delete`, `merge`, `remove` or `all` are unqueryable. Move the scan after lexing so only real tokens count", "status": "todo", "dependsOn": [], "milestone": "MI", "notes": "", "assignee": ""}, {"id": "QC.6", "description": "Remaining divergences batch — `[*2..]` silently parses as `[*2..2]` (open upper bound lost); bare `[*]` bakes in the parse-time default depth and breaks under a smaller engine `maxDepth` (defer to the engine's ceiling); `count(expr)` counts nulls and aggregate-only RETURN over an empty match yields zero rows instead of one (a `count(n)` tile shows nothing rather than 0); mixed `UNION`/`UNION ALL` applies global dedup (Neo4j rejects the mix); `[*3..1]` returns empty instead of erroring; ASC ordering puts nulls first where Cypher puts them last", "status": "todo", "dependsOn": [], "milestone": "MI", "notes": "", "assignee": ""}, {"id": "PL.1", "description": "Design spike: further plugin-feature work — scope what comes next for the plugin system (internal/plugin/) now that TD.5's upstream-default reconciliation exists as a precedent for how wyrd should handle user customisation drifting from built-in behaviour over time. Produces a proposal, not code — the outcome is a set of scoped follow-up tasks (plugin API surface, versioning story, discovery/install UX, etc.) added to this milestone once the spike concludes", "status": "todo", "dependsOn": ["TD.5"], "milestone": "MJ", "notes": "", "assignee": ""}], "ready": {"phase": "Wyrd", "candidates": [{"id": "SP.8", "description": "Budget engine over movements — `RecordSpend` creates a movement node plus a `draws_from` edge to the budget instead of appending to `spend_log`; `Compute` derives spent from cleared movements in the current period (net = draws_from − adds_to); the embedded `spend_log` representation is deleted outright — the dual-shape handling in `budget.SpendLog` and the CP.16 spend_log-preservation tes ilestoneSink": true, "notes": "", "assignee": ""}, {"id": "PL.1", "description": "Design spike: further plugin-feature work — scope what comes next for the plugin system (internal/plugin/) now that TD.5's upstream-default reconciliation exists as a precedent for how wyrd should handle user customisation drifting from built-in behaviour over time. Produces a proposal, not code — the outcome is a set of scoped follow-up tasks (plugin API surface, versioning story, discovery/install UX, etc.) added to this milestone once the spike concludes", "milestone": "MJ", "milestoneName": "Milestone: Plugin Extensibility", "milestoneDonePct": 0, "directDependents": 0, "transitiveUnblocks": 0, "isMilestoneSink": true, "notes": "", "assignee": ""}, {"id": "QC.1", "description": "Three-valued null logic — `null = null` currently evaluates `true` and `null \u003c\u003e x` evaluates `true` (Cypher: both `null`, row excluded), and `NOT null` evaluates `true` via truthiness; `WHERE` filters over absent properties are inverted as a result. Implement Cypher null propagation in `compareValues` and `NOT`", "milestone": "MI", "milestoneName": "Milestone I: Query Correctness", "milestoneDonePct": 0, "directDependents": 0, "transitiveUnblocks": 0, "isMilestoneSink": true, "notes": "", "assignee": ""}, {"id": "QC.2", "description": "UNION column-name validation — only column count is checked; rows from later branches keep their own map keys while `Columns` comes from the first branch, so mismatched aliases silently project `nil` and plain `UNION` collapses those rows to one. Error on differing column names, as Cypher does", "milestone": "MI", "milestoneName": "Milestone I: Query Correctness", "milestoneDonePct": 0, "directDependents": 0, "transitiveUnblocks": 0, "isMilestoneSink": true, "notes": "", "assignee": ""}, {"id": "QC.3", "description": "ORDER BY over expressions — sorting looks the recomputed column name up in the projected row, so `RETURN n.priority AS p ORDER BY n.priority` and ORDER BY on any unprojected expression silently no-op. Either evaluate ORDER BY expressions against the underlying match or reject unprojected expressions with a loud error", "milestone": "MI", "milestoneName": "Milestone I: Query Correctness", "milestoneDonePct": 0, "directDependents": 0, "transitiveUnblocks": 0, "isMilestoneSink": true, "notes": "", "assignee": ""}, {"id": "QC.4", "description": "Type-aware comparison — cross-type equality and ordering fall back to `fmt.Sprintf(\"%v\")`, so `n.priority = \"1\"` matches the integer 1 and `10 \u003e \"5\"` compares lexicographically; JSONC properties arrive as mixed float64/string/bool so spurious matches are routine. Remove the string-format fallback; unlike-type comparisons follow Cypher (false/null)", "milestone": "MI", "milestoneName": "Milestone I: Query Correctness", "milestoneDonePct": 0, "directDependents": 0, "transitiveUnblocks": 0, "isMilestoneSink": true, "notes": "", "assignee": ""}, {"id": "QC.5", "description": "Post-lex keyword rejection — the mutation/unsupported-keyword scan runs on raw query text, so keywords inside string literals or property names false-positive: `WHERE n.body = \"set the table\"` is rejected as a mutation and properties named `set`, `case`, `with`, `create`, `delete`, `merge`, `remove` or `all` are unqueryable. Move the scan after lexing so only real tokens count", "milestone": "MI", "milestoneName": "Milestone I: Query Correctness", "milestoneDonePct": 0, "directDependents": 0, "transitiveUnblocks": 0, "isMilestoneSink": true, "notes": "", "assignee": ""}, {"id": "QC.6", "description": "Remaining divergences batch — `[*2..]` silently parses as `[*2..2]` (open upper bound lost); bare `[*]` bakes in the parse-time default depth and breaks under a smaller engine `maxDepth` (defer to the engine's ceiling); `count(expr)` counts nulls and aggregate-only RETURN over an empty match yields zero rows instead of one (a `count(n)` tile shows nothing rather than 0); mixed `UNION`/`UNION ALL` a if (DATA.validation && DATA.validation.length) {
	document.getElementById("validation").innerHTML =
		`<div class="validation"><strong>${DATA.validation.length} validation ` +
		`discrepancy(ies):</strong> the numbers below reflect the file as-is.` +
		`<ul>${DATA.validation.map(v => `<li>${esc(v)}</li>`).join("")}</ul></div>`;
}

/* Milestone-level state (distinct from task status): computed server-side by
   roadmap.py's milestone_state() and carried as m.state, so the artefact
   never re-derives it and cannot disagree with the CLI's own stats/render
   paths. States: deferred, done, inProgress, todo, blocked, paused. */
const STATE_VAR = {
	deferred: "deferred", done: "done", inProgress: "in-progress",
	todo: "todo", blocked: "blocked", paused: "paused",
};
const STATE_RANK = { inProgress: 0, todo: 1, done: 2, blocked: 3, paused: 4, deferred: 5 };
/* Overview cards and Milestones details share this one ordering, computed
   once here rather than in Python, since build_stats' milestones[] stays in
   roadmap order for other consumers (_human_stats, next-task-*). */
const sortedMilestones = [...DATA.stats.milestones].sort((a, b) =>
	(STATE_RANK[a.state] - STATE_RANK[b.state])
	|| (b.donePct - a.donePct)
	|| a.name.localeCompare(b.name));

/* A dev-chip helper: colour + label for an assignee, empty string when unset. */
const devChip = assignee => {
	const varName = DATA.devColours?.[assignee];
	if (!assignee || !varName) return "";
	return `<span class="chip" style="--chip-fg:var(--color-dev-${varName});--chip-bg:var(--color-dev-${varName}-bg)">${esc(assignee)}</span>`;
};
/* A dependency-id chip: colour by what the id resolves to (task status,
   milestone sky, or gate yellow), using the server-computed depKinds map
   so the artefact never re-derives the graph. */
const depChip = id => {
	const k = DATA.depKinds?.[id];
	if (!k) return `<span class="chip">${esc(id)}</span>`;
	const varName = k.kind === "task" ? STATE_VAR[k.status] ?? "todo"
		: k.kind === "milestone" ? "milestone" : "gate";
	return `<span class="chip" style="--chip-fg:var(--color-${varName});--chip-bg:var(--color-${varName}-bg)">${esc(id)}</span>`;
};

/* Section 1 — Overview */
const st = DATA.stats;
document.getElementById("hero").innerHTML =
	`${st.byStatus.done}/${st.total} tasks<small>${st.donePct}% complete</small>` +
	`<small>${st.milestonesDone}/${st.milestonesTotal} milestones</small>`;

document.getElementById("milestone-cards").innerHTML = sortedMilestones.map(m => `
	<div class="card mini" style="--m-colour:var(--color-${STATE_VAR[m.state]})">
		<h3>${esc(m.id)}: ${esc(m.name)}</h3>
		<span class="count">${m.done}/${m.total} done · ${m.donePct}%</span>
		<div class="progress-bar"><div class="progress-fill"
			style="width:${m.donePct}%;background:var(--color-${STATE_VAR[m.state]})"></div></div>
	</div>`).join("");

/* Section 2 — Milestones. Groups lead with actionable work; milestones
   themselves follow the same order as the Overview cards above (A3), so a
   reader scanning top-to-bottom sees the same priority twice, not two
   different orderings of the same data. */
const GROUPS = [
	["todo",        "○ To Do",        "todo"],
	["blocked",     "✗ Blocked",      "blocked"],
	["paused",      "⏸ Paused",       "paused"],
	["deferred",    "⤓ Deferred",     "deferred"],
	["done",        "✓ Done",         "done"],
	["out_of_scope","⊘ Out of Scope", "out-of-scope"],
];
const readyIds = new Set(DATA.ready.candidates.map(c => c.id));
const tasksByMilestone = {};
for (const t of DATA.tasks) (tasksByMilestone[t.milestone] ??= []).push(t);

document.getElementById("milestone-details").innerHTML = sortedMilestones.map(m => {
	const tasks = tasksByMilestone[m.id] || [];
	const groups = GROUPS.map(([status, label, varName]) => {
		const members = tasks.filter(t => t.status === status);
		if (!members.length) return "";
		const items = members.map(t => {
			const deps = (t.dependsOn && t.dependsOn.length)
				? `<span class="deps">${t.dependsOn.map(depChip).join("")}</span>` : "";
			return `<li class="${status === "out_of_scope" ? "oos" : ""}">
				<span class="tid">${esc(t.id)}</span>${devChip(t.assignee)}
				<span class="tasktext">${esc(t.description)}</span>${deps}</li>`;
		}).join("");
		return `<div class="group">
			<h4 style="color:var(--color-${varName})">${label}</h4><ul>${items}</ul></div>`;
	}).join("");
	// All milestones render collapsed; the reader chooses what to expand
	return `<details class="milestone" style="--m-colour:var(--color-${STATE_VAR[m.state]})">
		<summary><span class="mid">${esc(m.id)}</span>${esc(m.name)}
			<span class="count">${m.done}/${m.total}</span></summary>
		<div class="body">${groups || "<p class='depnote'>No tasks.</p>"}</div>
	</details>`;
}).join("");

/* Section 3 — Dependency graph */
/* ELK lays out this dense a graph with far fewer crossings than the default
   dagre engine; if its module fails to load, dagre still renders. */
let layout = "dagre";
try {
	const elkLayouts = (await import("https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@0/dist/mermaid-layout-elk.esm.min.mjs")).default;
	mermaid.registerLayoutLoaders(elkLayouts);
	layout = "elk";
} catch { /* CDN unreachable — fall back */ }
mermaid.initialize({
	startOnLoad: false,
	theme: "base",
	layout,
	themeVariables: {
		fontSize: "16px",
		fontFamily: '"IBM Plex Mono", monospace',
	},
});
/* Mermaid 11's classDef parser rejects var(--x), so the semantic variables
   are resolved to concrete colours before rendering, and the graph re-renders
   when the colour scheme flips so it keeps tracking the page theme. A render
   failure is contained to the diagram shell — the sections after it must
   still populate. */
const wrap = document.getElementById("wrap");
const shell = document.getElementById("shell");
const diagram = document.getElementById("diagram");
let svgEl = null;
let scale = 1, tx = 0, ty = 0;
const apply = () => { if (svgEl) svgEl.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; };
const renderGraph = async () => {
	const rootStyle = getComputedStyle(document.documentElement);
	const src = DATA.mermaid.replace(/var\((--[\w-]+)\)/g,
		(_, name) => rootStyle.getPropertyValue(name).trim() || "#888888");
	try {
		const { svg } = await mermaid.render("roadmap-graph", src);
		diagram.innerHTML = svg;
	} catch (err) {
		document.getElementById("droadmap-graph")?.remove();
		diagram.innerHTML = `<p class="depnote">Dependency graph failed to render: ${esc(String(err))}</p>`;
		return;
	}
	svgEl = wrap.querySelector("svg");
	svgEl.addEventListener("dblclick", () => shell.classList.toggle("expanded"));
	apply();
};
await renderGraph();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderGraph);

/* Zoom/pan: buttons, ctrl+wheel, drag; expand toggles a fixed overlay */
const zoom = f => { scale = Math.min(4, Math.max(0.25, scale * f)); apply(); };
shell.querySelector(".diagram-toolbar").addEventListener("click", e => {
	const act = e.target.dataset.act;
	if (act === "in") zoom(1.25);
	else if (act === "out") zoom(0.8);
	else if (act === "reset") { scale = 1; tx = ty = 0; apply(); }
	else if (act === "expand") shell.classList.toggle("expanded");
});
wrap.addEventListener("wheel", e => {
	if (!e.ctrlKey && !e.metaKey) return;
	e.preventDefault();
	zoom(e.deltaY < 0 ? 1.1 : 0.9);
}, { passive: false });
let drag = null;
wrap.addEventListener("pointerdown", e => { drag = { x: e.clientX - tx, y: e.clientY - ty }; wrap.setPointerCapture(e.pointerId); });
wrap.addEventListener("pointermove", e => { if (drag) { tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); } });
wrap.addEventListener("pointerup", () => { drag = null; });

/* Section 4 — Next Up (pre-vetted by roadmap.py ready). Same chip structure
   as the Milestones section (A5); grouped by dev only when the READY SET
   (the candidates actually shown here, not the whole phase) has more than
   one distinct assignee, so a solo project (or a phase where only one dev's
   work happens to be unblocked right now) stays flat rather than gaining a
   pointless single-group heading. */
const candidateLi = c => `
	<li>
		<span class="tid">${esc(c.id)}</span>${devChip(c.assignee)}
		<span class="tasktext">${esc(c.description)}</span>
		<span class="deps"><span class="chip" style="--chip-fg:var(--color-milestone);--chip-bg:var(--color-milestone-bg)">${esc(c.milestone)}: ${esc(c.milestoneName)}</span></span>
		<span class="signal">unblocks ${c.transitiveUnblocks}${c.isMilestoneSink ? " · completes milestone" : ""}</span>
	</li>`;
const readyAssignees = new Set(DATA.ready.candidates.map(c => c.assignee).filter(Boolean));
document.getElementById("ready").innerHTML = !DATA.ready.candidates.length
	? "<li>No unblocked tasks: clear a blocker or a gate.</li>"
	: readyAssignees.size > 1
	? [...readyAssignees].sort().map(dev => `
		<li class="nextup-devgroup"><h4>${devChip(dev)}</h4>
			<ul style="list-style:none;margin:0;padding:0">${DATA.ready.candidates.filter(c => c.assignee === dev).map(candidateLi).join("")}</ul>
		</li>`).join("") +
		(DATA.ready.candidates.some(c => !c.assignee)
			? `<li class="nextup-devgroup"><h4>Unassigned</h4>
				<ul style="list-style:none;margin:0;padding:0">${DATA.ready.candidates.filter(c => !c.assignee).map(candidateLi).join("")}</ul>
			</li>` : "")
	: DATA.ready.candidates.map(candidateLi).join("");

/* Nav highlight */
const links = [...document.querySelectorAll("nav a")];
const highlight = new IntersectionObserver(entries => {
	for (const en of entries) if (en.isIntersecting) {
		links.forEach(a => a.classList.toggle("active", a.hash === "#" + en.target.id));
	}
}, { rootMargin: "-30% 0px -60% 0px" });
links.forEach(a => highlight.observe(document.querySelector(a.hash)));
</script>
</body>
</html>
